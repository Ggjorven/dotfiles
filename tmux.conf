# Start numbering windows and panes at 1
set -g base-index 1
set -g pane-base-index 1

# Use Alt+number to switch windows quickly
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Optional quality of life tweaks
setw -g mode-keys vi
set -g mouse off

# Fix tmux colours
set-option -a terminal-features 'alacritty:RGB'
set -g default-terminal "tmux-256color"

# Fix Ctrl+Enter being the same as Enter
set -s extended-keys always
set -as terminal-features 'alacritty:extkeys'

# Status bar
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-left ""
set -g status-right ""
set -g status-style "bg=default"

# [1][2][3] flush together, focus = bright/bold
set -g window-status-separator ""
set -g window-status-format         "#[fg=colour244][#I]"
set -g window-status-current-format "#[fg=colour15,bold][#I]"

# Kill the horizontal rule lines around the bar / panes
set -g pane-border-status off
set -g pane-border-lines single
